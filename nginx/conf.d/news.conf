# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name tikvah.com www.tikvah.com admin.tikvah.com api.tikvah.com minio.tikvah.com;
    return 301 https://$host$request_uri;
}

# Common SSL & Proxy settings
ssl_certificate /etc/nginx/certs/nginx.crt;
ssl_certificate_key /etc/nginx/certs/nginx.key;

# Main Site (Public)
server {
    listen 443 ssl;
    server_name tikvah.com www.tikvah.com;

    location / {
        proxy_pass http://news:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin CMS
server {
    listen 443 ssl;
    server_name admin.tikvah.com;

    location / {
        proxy_pass http://cms:3030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API
server {
    listen 443 ssl;
    server_name api.tikvah.com;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# MinIO (S3 API & Web Console)
server {
    listen 443 ssl;
    server_name minio.tikvah.com;

    # Allow large file uploads to MinIO
    client_max_body_size 1000M;

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Required for MinIO Console)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
