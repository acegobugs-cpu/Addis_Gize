name: times

# Import infrastructure & services from ./app/docker-compose.yml
include:
  - ./app/docker-compose.yml

services:
  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:1.25-alpine
    container_name: times-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/www:/var/www/certbot
      - ./nginx/crt:/etc/nginx/certs:ro
    depends_on:
      - app
      - news
    networks:
      - times-network

  # --- CertBot ---
  certbot:
    image: certbot/certbot
    container_name: times-certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot
    networks:
      - times-network

  # --- Next.js Frontend ---
  news:
    build:
      context: ./news
      dockerfile: Dockerfile
    container_name: times-news
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://app:8080
    depends_on:
      - app
    networks:
      - times-network
    restart: unless-stopped

  # --- Go Backend ---
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: times-app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    networks:
      - times-network
    restart: unless-stopped

networks:
  times-network:
    name: times-network
