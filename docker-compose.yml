services:
  #--- Nginx Reverse proxy ---
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      # - ./nginx/certs:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot
      - ./nginx/crt:/etc/nginx/certs:ro
    depends_on:
      - public
      - admin
      - api
      - minio
    networks:
      - internal

  # --- CertBot ---
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot
    networks:
      - internal


# --- Volumes ---
volumes:

# --- Networks ---
networks:
  internal:
    driver: bridge
