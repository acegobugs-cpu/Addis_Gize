  postgres:
    image: postgres:15-alpine
    container_name: dailytimes-postgres
    ports:
      - "5432:5432"
    env_file:
      - ./.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./.docker/pg-init:/docker-entrypoint-initdb.d
    networks:
      - dailytimes-network
    restart: unless-stopped

  # --- MinIO Object Storage ---
  minio:
    image: minio/minio:latest
    container_name: minio
    env_file:
      - ./.env
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    networks:
      - dailytimes-network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: dailytimes-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - dailytimes-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dailytimes-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - "./.env"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - dailytimes-network
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: dailytimes_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Set to false for local development ease
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 5

  # kibana:
  #   image: docker.elastic.co/kibana/kibana:8.12.0
  #   container_name: dailytimes_kibana
  #   ports:
  #     - "5601:5601"
  #   environment:
  #     - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
  #   depends_on:
  #     elasticsearch:
  #       condition: service_healthy

networks:
  dailytimes-network:
    driver: bridge

volumes:
  postgres-data:
  minio_data:
  redis-data:
  rabbitmq-data:
  esdata:
    driver: local
