name: times-infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: times-postgres
    ports:
      - "5432:5432"
    env_file:
      - ./.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./.docker/pg-init:/docker-entrypoint-initdb.d
    networks:
      - times-network
    restart: unless-stopped

  # --- MinIO Object Storage ---
  minio:
    image: minio/minio:latest
    container_name: times-minio
    env_file:
      - ./.env
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    networks:
      - times-network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: times-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - times-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: times-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - "./.env"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - times-network
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: times-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - times-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 5

networks:
  times-network:
    name: times-network # Pins global network name across both configs

volumes:
  postgres-data:
    name: times_postgres_data # Fixed global volume name
  minio_data:
    name: times_minio_data
  redis-data:
    name: times_redis_data
  rabbitmq-data:
    name: times_rabbitmq_data
  esdata:
    name: times_esdata
